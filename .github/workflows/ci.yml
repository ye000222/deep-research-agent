name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  l1-postgres-and-l2:
    name: CI / L1 PostgreSQL + L2 deterministic smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: deep_research
          POSTGRES_PASSWORD: deep_research
          POSTGRES_DB: deep_research
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U deep_research -d deep_research"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RUN_POSTGRES_INTEGRATION: "1"
      RUN_DETERMINISTIC_SMOKE: "1"
      DATABASE_URL: postgresql+psycopg://deep_research:deep_research@localhost:5432/deep_research
      TEST_DATABASE_URL: postgresql+psycopg://deep_research:deep_research@localhost:5432/deep_research_test
      CHECKPOINT_DATABASE_URI: postgresql://deep_research:deep_research@localhost:5432/deep_research_checkpoint
      L2_DATABASE_URL: postgresql+psycopg://deep_research:deep_research@localhost:5432/deep_research_l2
      L2_CHECKPOINT_DATABASE_URI: postgresql://deep_research:deep_research@localhost:5432/deep_research_l2_checkpoint
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API dependencies
        run: pip install -e ".[dev]"
      - name: Prepare isolated PostgreSQL databases
        run: |
          python - <<'PY'
          import psycopg

          admin_url = "postgresql://deep_research:deep_research@localhost:5432/deep_research"
          admin = psycopg.connect(admin_url, autocommit=True)
          for name in ("deep_research_checkpoint", "deep_research_test", "deep_research_l2", "deep_research_l2_checkpoint"):
              try:
                  admin.execute(f'CREATE DATABASE "{name}"')
              except psycopg.errors.DuplicateDatabase:
                  pass
          admin.execute("CREATE EXTENSION IF NOT EXISTS pg_trgm")
          admin.execute("CREATE EXTENSION IF NOT EXISTS unaccent")
          admin.close()

          for name in ("deep_research_test", "deep_research_l2"):
              with psycopg.connect(f"postgresql://deep_research:deep_research@localhost:5432/{name}", autocommit=True) as db:
                  db.execute("CREATE EXTENSION IF NOT EXISTS pg_trgm")
                  db.execute("CREATE EXTENSION IF NOT EXISTS unaccent")
          PY
      - name: Apply business and integration migrations
        run: |
          start=$(date +%s)
          alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
          DATABASE_URL="$L2_DATABASE_URL" alembic upgrade head
          echo "Business, PostgreSQL integration, and L2 migrations: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Initialize checkpoint schemas
        run: |
          python -m app.cli.setup_checkpoints
          CHECKPOINT_DATABASE_URI="$L2_CHECKPOINT_DATABASE_URI" python -m app.cli.setup_checkpoints
      - name: Verify PostgreSQL and Redis readiness
        run: |
          start=$(date +%s)
          pg_isready -h localhost -p 5432 -U deep_research -d deep_research
          test "$(redis-cli -h localhost -p 6379 ping)" = "PONG"
          echo "Runner-side database/broker readiness check: $(( $(date +%s) - start ))s (service provisioning is managed before runner steps)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run PostgreSQL and deterministic L2 integration tests
        run: |
          start=$(date +%s)
          pytest tests/integration -q
          echo "PostgreSQL integration + L2 smoke: $(( $(date +%s) - start ))s" >> "$GITHUB_STEP_SUMMARY"
      - name: Run PostgreSQL recovery smoke test
        run: python scripts/verify_postgres_recovery.py
      - name: Upload deterministic L2 result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-research-smoke
          path: artifacts/test_infrastructure_result.json
          if-no-files-found: warn
      - name: Report job timing
        if: always()
        run: echo "L1 PostgreSQL + L2 job steps finished at $(date -u +%Y-%m-%dT%H:%M:%SZ). See preceding migration, readiness, and smoke timings." >> "$GITHUB_STEP_SUMMARY"

  api:
    name: CI / L1 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API dependencies
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check apps/api tests
      - name: Mypy
        run: mypy apps/api/app
      - name: Unit and API tests
        run: pytest tests/unit tests/api -q

  web:
    name: CI / L1 Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @deep-research/web build

  static:
    name: CI / L1 Static and release consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project package
        run: pip install -e .
      - name: Compose configuration
        run: docker compose config --quiet
      - name: Release metadata, migration graph, golden fixture, and secret checks
        run: python scripts/release_gate.py --skip-compose --skip-static --skip-integration --skip-web --report-path artifacts/release_gate.json
      - name: Upload static gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-release-consistency
          path: artifacts/release_gate.json
          if-no-files-found: warn
