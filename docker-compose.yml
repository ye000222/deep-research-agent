services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: deep_research
      POSTGRES_PASSWORD: deep_research
      POSTGRES_DB: deep_research
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deep_research -d deep_research"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  searxng:
    image: searxng/searxng:latest
    ports:
      # 8080 可能被 Docker Desktop 自身占用，映射到 8081
      - "127.0.0.1:8081:8080"
    environment:
      SEARXNG_BASE_URL: http://localhost:8081/
      # Optional outbound proxy for upstream search engines.  Docker cannot
      # reach a host-only 127.0.0.1 proxy directly; use host.docker.internal
      # in the local .env when Docker Desktop needs the host proxy.
      HTTP_PROXY: ${SEARXNG_HTTP_PROXY:-}
      HTTPS_PROXY: ${SEARXNG_HTTPS_PROXY:-}
      ALL_PROXY: ${SEARXNG_ALL_PROXY:-}
      NO_PROXY: ${SEARXNG_NO_PROXY:-localhost,127.0.0.1,searxng,postgres,redis}
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

  migrate:
    image: deep-research-agent-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      SOURCE_REVISION: ${SOURCE_REVISION:-development}
      PYTHONPATH: /app/apps/api
      DATABASE_URL: postgresql+psycopg://deep_research:deep_research@postgres:5432/deep_research
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./apps/api:/app/apps/api:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: deep-research-agent-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      SOURCE_REVISION: ${SOURCE_REVISION:-development}
      PYTHONPATH: /app/apps/api
      DATABASE_URL: postgresql+psycopg://deep_research:deep_research@postgres:5432/deep_research
      CHECKPOINT_DATABASE_URI: postgresql://deep_research:deep_research@postgres:5432/deep_research_checkpoint
      REDIS_URL: redis://redis:6379/0
      SEARXNG_BASE_URL: http://searxng:8080
      MODEL_HTTP_PROXY: ${MODEL_HTTP_PROXY:-}
      PUBLIC_WEB_HTTP_PROXY: ${PUBLIC_WEB_HTTP_PROXY:-}
      SEARXNG_PREFERRED_ENGINES: ${SEARXNG_PREFERRED_ENGINES:-}
      EVIDENCE_AWARE_CONTEXT_ENABLED: ${EVIDENCE_AWARE_CONTEXT_ENABLED:-false}
      INDEPENDENT_SOURCE_TARGETING_ENABLED: ${INDEPENDENT_SOURCE_TARGETING_ENABLED:-true}
      EVIDENCE_INPUT_QUALITY_ENABLED: ${EVIDENCE_INPUT_QUALITY_ENABLED:-false}
      ARTIFACT_ROOT: /app/artifacts
      PERSIST_PROVIDER_CREDENTIALS: "true"
      SECRET_MASTER_KEY_FILE: /app/artifacts/.secrets/provider_master_key
      PROVIDER_SESSION_COOKIE_NAME: dr_client_session
      ALLOW_INSECURE_PROVIDER_ENDPOINTS: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/app/apps/api:ro
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  worker:
    image: deep-research-agent-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      SOURCE_REVISION: ${SOURCE_REVISION:-development}
      PYTHONPATH: /app/apps/api
      DATABASE_URL: postgresql+psycopg://deep_research:deep_research@postgres:5432/deep_research
      CHECKPOINT_DATABASE_URI: postgresql://deep_research:deep_research@postgres:5432/deep_research_checkpoint
      REDIS_URL: redis://redis:6379/0
      SEARXNG_BASE_URL: http://searxng:8080
      MODEL_HTTP_PROXY: ${MODEL_HTTP_PROXY:-}
      PUBLIC_WEB_HTTP_PROXY: ${PUBLIC_WEB_HTTP_PROXY:-}
      SEARXNG_PREFERRED_ENGINES: ${SEARXNG_PREFERRED_ENGINES:-}
      EVIDENCE_AWARE_CONTEXT_ENABLED: ${EVIDENCE_AWARE_CONTEXT_ENABLED:-false}
      INDEPENDENT_SOURCE_TARGETING_ENABLED: ${INDEPENDENT_SOURCE_TARGETING_ENABLED:-true}
      EVIDENCE_INPUT_QUALITY_ENABLED: ${EVIDENCE_INPUT_QUALITY_ENABLED:-false}
      ARTIFACT_ROOT: /app/artifacts
      PERSIST_PROVIDER_CREDENTIALS: "true"
      SECRET_MASTER_KEY_FILE: /app/artifacts/.secrets/provider_master_key
      ALLOW_INSECURE_PROVIDER_ENDPOINTS: "true"
      # Keep local development responsive while allowing deployments to tune
      # concurrency to the provider's rate limit and available CPU.
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
    command:
      ["celery", "-A", "app.worker.celery_app:celery_app", "worker", "--loglevel=INFO", "--concurrency=${WORKER_CONCURRENCY:-2}"]
    volumes:
      - ./apps/api:/app/apps/api:ro
      - artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  dispatcher:
    image: deep-research-agent-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      SOURCE_REVISION: ${SOURCE_REVISION:-development}
      PYTHONPATH: /app/apps/api
      DATABASE_URL: postgresql+psycopg://deep_research:deep_research@postgres:5432/deep_research
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker.dispatcher"]
    volumes:
      - ./apps/api:/app/apps/api:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    image: deep-research-agent-api:local
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      APP_ENV: development
      APP_VERSION: ${APP_VERSION:-1.0.0-rc.1}
      SOURCE_REVISION: ${SOURCE_REVISION:-development}
      PYTHONPATH: /app/apps/api
      DATABASE_URL: postgresql+psycopg://deep_research:deep_research@postgres:5432/deep_research
      REDIS_URL: redis://redis:6379/0
    command: ["celery", "-A", "app.worker.celery_app:celery_app", "beat", "--loglevel=INFO"]
    volumes:
      - ./apps/api:/app/apps/api:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_SOURCE_REVISION: ${SOURCE_REVISION:-development}
    ports:
      # 5173 可能被其他本地项目（如 bm-web 容器）占用，映射到 5174
      - "127.0.0.1:5174:5174"
    volumes:
      - ./apps/web/src:/workspace/apps/web/src:ro
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  artifacts:
